# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: End-to-End Tests

# SENG 34213 §6.2 — E2E coverage of every happy path and the top three critical
# flows, driven through a real browser against a running stack.
#
# Kept separate from ci.yml because it is an order of magnitude slower: it
# builds the frontend, boots both halves of the application, and downloads a
# browser. Running it on every push to a feature branch would make the fast
# feedback loop useless, so it runs on pull requests to develop and main, on a
# nightly schedule, and on demand.

on:
  pull_request:
    branches: [develop, main]
  schedule:
    # 02:00 UTC — 07:30 Sri Lanka time, so a failure is waiting when the team
    # starts rather than discovered at the end of the day.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Run against an already-deployed environment instead of booting one'
        required: false
        type: string

env:
  NODE_VERSION: '20.x'
  SUT_REPOSITORY: ${{ vars.SUT_REPOSITORY || 'TeamNova-SRI-KO-LMS/app' }}
  SUT_REF: ${{ vars.SUT_REF || 'develop' }}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright End-to-End
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Check out the application under test
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SUT_REPOSITORY }}
          ref: ${{ env.SUT_REF }}
          path: .sut/app
          token: ${{ secrets.SUT_ACCESS_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Install application dependencies
        run: |
          npm ci --no-audit --no-fund --prefix .sut/app/Backend
          npm ci --no-audit --no-fund --prefix .sut/app/Frontend

      - name: Cache the Playwright browser
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npm run test:e2e:install

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run the end-to-end suite
        run: npm run test:e2e
        env:
          SUT_PATH: .sut/app
          E2E_MONGODB_URI: mongodb://127.0.0.1:27017/sriko_lms_e2e
          # When a base URL is supplied, the suite runs against that deployment
          # instead of booting its own — which is how §9.1 asks the final
          # demonstration to be verified on staging.
          E2E_FRONTEND_URL: ${{ inputs.base_url || 'http://localhost:5173' }}
          E2E_EXTERNAL: ${{ inputs.base_url != '' }}

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/e2e/
          retention-days: 30

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: reports/e2e/artifacts/
          retention-days: 14
