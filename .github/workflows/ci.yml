# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI Pipeline

# SENG 34213 §7.2 — the required pipeline stages, in order:
#   Lint & Format → Build → Unit Tests → Integration Tests → Security Scan
#
# This repository holds the test suite; the System Under Test is the
# application repository, checked out alongside it. `SUT_PATH` is what connects
# the two (see testing.config.js).

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  # The application repository and the ref to test against. Override through
  # repository variables when testing a feature branch of the application.
  SUT_REPOSITORY: ${{ vars.SUT_REPOSITORY || 'TeamNova-SRI-KO-LMS/app' }}
  SUT_REF: ${{ vars.SUT_REF || 'develop' }}

# A new push supersedes an in-flight run on the same ref: there is no value in
# finishing a build for a commit that is already out of date.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Stage 1 — Lint & Format
  # ───────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  # ───────────────────────────────────────────────────────────────────────────
  # Stage 2 — Build
  #
  # A test repository has nothing to compile, so "build" here means: can the
  # harness locate the application, load its Express app, and derive the
  # endpoint inventory the later stages depend on? A failure at this stage is
  # a wiring problem, and separating it means the test jobs never fail for a
  # reason that has nothing to do with the tests.
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Wire Up the System Under Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Check out the application under test
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SUT_REPOSITORY }}
          ref: ${{ env.SUT_REF }}
          path: .sut/app
          token: ${{ secrets.SUT_ACCESS_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
        working-directory: .sut/app/Backend

      - name: Verify the harness can load the application
        run: npm run sut:verify
        env:
          SUT_PATH: .sut/app

      - name: Extract the API endpoint inventory
        run: npm run sut:endpoints
        env:
          SUT_PATH: .sut/app

      - name: Upload the endpoint inventory
        uses: actions/upload-artifact@v4
        with:
          name: endpoint-inventory
          path: reports/endpoint-inventory.json
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # Stage 3 — Unit Tests
  # ───────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Check out the application under test
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SUT_REPOSITORY }}
          ref: ${{ env.SUT_REF }}
          path: .sut/app
          token: ${{ secrets.SUT_ACCESS_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm ci --no-audit --no-fund
        working-directory: .sut/app/Backend

      - name: Backend unit tests
        run: npm run test:unit
        env:
          SUT_PATH: .sut/app

      - name: Frontend unit and component tests
        run: npm run test:frontend
        env:
          SUT_PATH: .sut/app

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit
          path: reports/junit/
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # Stage 4 — Integration Tests (+ coverage and the endpoint-coverage gate)
  # ───────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration & Security Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Check out the application under test
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SUT_REPOSITORY }}
          ref: ${{ env.SUT_REF }}
          path: .sut/app
          token: ${{ secrets.SUT_ACCESS_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm ci --no-audit --no-fund
        working-directory: .sut/app/Backend

      - name: Extract the API endpoint inventory
        run: npm run sut:endpoints
        env:
          SUT_PATH: .sut/app

      # Unit, integration and security in one instrumented pass. The security
      # suite exercises the same application code, so running it separately
      # would both duplicate the work and understate the coverage figure.
      - name: Unit, integration and security tests with coverage
        run: npm run coverage:backend
        env:
          SUT_PATH: .sut/app
          # The service container replaces mongodb-memory-server, so nothing is
          # downloaded at run time and the job stays fast and offline.
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/sriko_lms_test

      - name: Frontend coverage
        run: npm run coverage:frontend
        env:
          SUT_PATH: .sut/app

      - name: Merge coverage reports
        run: npm run coverage:merge

      # ── Quality gates (§6.4 and §8.2) ────────────────────────────────────
      - name: Coverage gate — 80% overall, 90% on critical business logic
        run: npm run coverage:check

      - name: Endpoint gate — every API endpoint has an integration test
        run: npm run report:endpoints
        env:
          SUT_PATH: .sut/app

      # ── Reports for the sprint review (§6.4: "linked in each Sprint Review")
      - name: Generate the test register
        if: always()
        run: npm run report:register
        env:
          SUT_PATH: .sut/app

      - name: Generate the traceability matrix
        if: always()
        run: npm run report:traceability
        env:
          SUT_PATH: .sut/app

      - name: Generate the OWASP compliance evidence
        if: always()
        run: npm run report:owasp
        env:
          SUT_PATH: .sut/app

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: reports/coverage/
          retention-days: 30

      - name: Upload generated documentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            docs/testing/TEST_REGISTER.md
            docs/testing/TRACEABILITY_MATRIX.md
            docs/security/OWASP_COMPLIANCE.md
            reports/endpoint-coverage.md
            reports/coverage-summary.md
          retention-days: 90

      - name: Summarise the run
        if: always()
        run: |
          {
            echo "## Test results"
            echo
            [ -f reports/coverage-summary.md ] && sed -n '1,40p' reports/coverage-summary.md
            echo
            [ -f reports/endpoint-coverage.md ] && sed -n '/## Summary/,/^$/p' reports/endpoint-coverage.md
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # Stage 5 — Security Scan (§7.2, OWASP A06 and A08)
  # ───────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Check out the application under test
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SUT_REPOSITORY }}
          ref: ${{ env.SUT_REF }}
          path: .sut/app
          token: ${{ secrets.SUT_ACCESS_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Audit the test repository
        run: npm audit --audit-level=high

      # `npm ci` itself is the A08 integrity check: it verifies every package
      # against the committed lockfile and refuses to proceed on a mismatch.
      - name: Verify the application lockfile integrity
        run: npm ci --no-audit --no-fund
        working-directory: .sut/app/Backend

      - name: Audit the application backend
        run: npm audit --audit-level=high
        working-directory: .sut/app/Backend

      - name: Audit the application frontend
        run: npm audit --audit-level=high
        working-directory: .sut/app/Frontend

  # ───────────────────────────────────────────────────────────────────────────
  # Gate — a single required check for branch protection
  # ───────────────────────────────────────────────────────────────────────────
  pipeline:
    name: CI Pipeline
    runs-on: ubuntu-latest
    needs: [lint, build, unit-tests, integration-tests, security-scan]
    if: always()
    steps:
      - name: Fail if any stage failed
        # Branch protection points at this one check, so adding a stage above
        # does not require reconfiguring the protected branch.
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more pipeline stages failed."
            exit 1
          fi
          echo "All pipeline stages passed."
